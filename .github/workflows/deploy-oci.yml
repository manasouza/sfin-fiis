name: Deploy to OCI VM

on:
  push:
    branches: [ "deployment-byassist" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install SSH key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.OCI_VM_SSH_KEY }}
        known_hosts: ${{ secrets.OCI_VM_KNOWN_HOSTS }}

    - name: Copy files to VM
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.OCI_VM_HOST }}
        username: ${{ secrets.OCI_VM_USER }}
        key: ${{ secrets.OCI_VM_SSH_KEY }}
        source: "."
        target: "/home/${{ secrets.OCI_VM_USER }}/sfin-fiis"

    - name: Install dependencies
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.OCI_VM_HOST }}
        username: ${{ secrets.OCI_VM_USER }}
        key: ${{ secrets.OCI_VM_SSH_KEY }}
        script: |
          cd /home/${{ secrets.OCI_VM_USER }}/sfin-fiis
          # create a centralized virtual environment in the home directory
          PYENV_DIR="/home/${{ secrets.OCI_VM_USER }}/pyenvs/sfin-fiis"
          if [ ! -d "$PYENV_DIR" ]; then
            python -m venv "$PYENV_DIR"
          fi
          # activate and install
          source "$PYENV_DIR/bin/activate"
          python -m pip install --upgrade pip
          pip install -r requirements.txt